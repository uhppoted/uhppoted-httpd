name: docker

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:

  build:
    name: Push uhppoted-httpd container to docker.io
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.x
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'
        cache: false

    - name: Install staticcheck
      run: go install honnef.co/go/tools/cmd/staticcheck@latest

    - name: Setup NPM
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}

    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: Install eslint
      run: npm install eslint prettier --save-dev

    - name: Install sass
      run: npm install sass --save-dev

    - name: Build Docker image
      run: |
        make docker-dockerhub
        docker images

    - name: Docker login to docker.io
      run: |
        echo "${{ secrets.DOCKERHUB }}" | docker login -u uhppoted --password-stdin

    - name: Push Docker 'latest' image to docker.io
      run: |
        docker push uhppoted/httpd:latest

    - name: Push versioned Docker image to docker.io
      if: github.event_name == 'release' && github.event.action == 'published'
      run: |
        TAG="${{ github.event.release.tag_name }}"
        VERSION=${TAG#v}
        echo ">>>>>> build Docker image version ${VERSION}"
        make docker-ghcr DOCKER=uhppoted/httpd:${VERSION}
        docker images
        docker push uhppoted/httpd:${VERSION}
